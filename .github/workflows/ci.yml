name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: 类型检查 + 构建
        run: npm run build

      - name: 单元 + 集成测试（假站点）
        run: npm test

      - name: stdio 冒烟
        run: npm run smoke
